<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileIT — Data Model</title>
<style>
body{margin:0;padding:24px;background:#FAF7F2;font-family:system-ui,sans-serif}
svg{width:100%;height:auto;display:block}
.t{font-family:system-ui,sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:system-ui,sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:system-ui,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.node{cursor:pointer}
.node:hover{opacity:0.85}
.arr{stroke:var(--s,#888780);stroke-width:1.5;fill:none}
.box{fill:#F1EFE8;stroke:#888780;stroke-width:0.5}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:4 3;fill:none}

.c-teal rect,.c-teal circle,.c-teal ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.c-teal .t,.c-teal .th{fill:#085041}
.c-teal .ts{fill:#0F6E56}

.c-purple rect,.c-purple circle,.c-purple ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.c-purple .t,.c-purple .th{fill:#3C3489}
.c-purple .ts{fill:#534AB7}

.c-amber rect,.c-amber circle,.c-amber ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}
.c-amber .t,.c-amber .th{fill:#633806}
.c-amber .ts{fill:#854F0B}

.c-green rect,.c-green circle,.c-green ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.5}
.c-green .t,.c-green .th{fill:#27500A}
.c-green .ts{fill:#3B6D11}

.c-red rect,.c-red circle,.c-red ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5}
.c-red .t,.c-red .th{fill:#791F1F}
.c-red .ts{fill:#A32D2D}

.c-gray rect,.c-gray circle,.c-gray ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.c-gray .t,.c-gray .th{fill:#444441}
.c-gray .ts{fill:#5F5E5A}

@media(prefers-color-scheme:dark){
  body{background:#1a1917}
  .t,.th{fill:#E8E6E0}
  .ts{fill:#9C9A92}
  .c-teal rect,.c-teal circle,.c-teal ellipse{fill:#085041;stroke:#5DCAA5}
  .c-teal .t,.c-teal .th{fill:#9FE1CB}
  .c-teal .ts{fill:#5DCAA5}
  .c-purple rect,.c-purple circle,.c-purple ellipse{fill:#3C3489;stroke:#AFA9EC}
  .c-purple .t,.c-purple .th{fill:#CECBF6}
  .c-purple .ts{fill:#AFA9EC}
  .c-amber rect,.c-amber circle,.c-amber ellipse{fill:#633806;stroke:#EF9F27}
  .c-amber .t,.c-amber .th{fill:#FAC775}
  .c-amber .ts{fill:#EF9F27}
  .c-green rect,.c-green circle,.c-green ellipse{fill:#27500A;stroke:#97C459}
  .c-green .t,.c-green .th{fill:#C0DD97}
  .c-green .ts{fill:#97C459}
  .c-red rect,.c-red circle,.c-red ellipse{fill:#791F1F;stroke:#F09595}
  .c-red .t,.c-red .th{fill:#F7C1C1}
  .c-red .ts{fill:#F09595}
  .c-gray rect,.c-gray circle,.c-gray ellipse{fill:#444441;stroke:#B4B2A9}
  .c-gray .t,.c-gray .th{fill:#D3D1C7}
  .c-gray .ts{fill:#B4B2A9}
  .arr{stroke:#888780}
  .leader{stroke:#5F5E5A}
}
</style>
</head>
<body>
<svg viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>FileIT data model — in-memory session state and compliance boundaries</title>
<desc>Two-zone diagram: left zone shows the in-memory Rust structs (FileRecord, ClassifiedFile, SessionState), right zone shows what never persists to disk. Arrows show data flow between structs.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="ts" x="340" y="24" text-anchor="middle" dominant-baseline="central">Everything below lives in RAM only · zeroed on Drop · never serialized to disk</text>

<g class="c-teal">
  <rect x="40" y="40" width="190" height="170" rx="12" stroke-width="0.5"/>
  <text class="th" x="135" y="64" text-anchor="middle" dominant-baseline="central">FileRecord</text>
  <text class="ts" x="135" y="82" text-anchor="middle" dominant-baseline="central">raw scan output</text>
</g>
<g class="c-teal">

</g>
<g class="c-teal">
  <rect x="56" y="118" width="158" height="18" rx="3" stroke-width="0.5"/>

</g>
<g class="c-teal">
  <rect x="56" y="142" width="158" height="18" rx="3" stroke-width="0.5"/>

</g>
<g class="c-teal">
  <rect x="56" y="166" width="158" height="18" rx="3" stroke-width="0.5"/>

</g>

</g>

</g>

  <rect x="274" y="142" width="158" height="18" rx="3" stroke-width="0.5"/>

</g>
<g class="c-purple">
  <rect x="274" y="166" width="158" height="18" rx="3" stroke-width="0.5"/>
  <text class="ts" x="353" y="175" text-anchor="middle" dominant-baseline="central">institution: Option[String]</text>
</g>
<g class="c-purple">
  <rect x="274" y="190" width="158" height="18" rx="3" stroke-width="0.5"/>
  <text class="ts" x="353" y="199" text-anchor="middle" dominant-baseline="central">doc_date: Option[NaiveDate]</text>
</g>

  <rect x="274" y="214" width="158" height="18" rx="3" stroke-width="0.5"/>

</g>

<g class="c-amber">

  <rect x="492" y="246" width="132" height="30" rx="4" stroke-width="0.5"/>

</g>

<rect x="40" y="300" width="600" height="1" fill="none" stroke="#888780" stroke-dasharray="5 4" stroke-width="0.5"/>
<text class="ts" x="340" y="314" text-anchor="middle" dominant-baseline="central">Compliance boundary — nothing above this line is ever written to disk</text>

</g>

<g class="c-gray">
  <rect x="450" y="330" width="190" height="80" rx="10" stroke-width="0.5"/>

  <text class="ts" x="545" y="374" text-anchor="middle" dominant-baseline="central">aggregate counts only</text>

</g>

<g class="c-gray">
  <rect x="40" y="432" width="600" height="100" rx="12" stroke-width="0.5"/>

</g>
