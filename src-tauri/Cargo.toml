[package]
name = "fileit"
version = "1.1.0"
description = "FileIT — Smart file organiser for Czech financial advisory agents"
authors = ["FileIT Team"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "fileit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fileit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
# Tauri core. Major.minor must match the npm packages in package.json
# (@tauri-apps/api 2.11, plugin-dialog 2.7, plugin-fs 2.5, plugin-shell 2.3):
# `tauri build` refuses mismatched versions. Bump both sides together.
tauri = { version = "~2.11", features = [] }
tauri-plugin-dialog = "~2.7"
tauri-plugin-fs = "~2.5"
tauri-plugin-shell = "~2.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File walking
walkdir = "2"

# PDF text extraction

# DOCX/XLSX text extraction (via zip + XML parsing)
zip = "2"
quick-xml = "0.36"

# Regex for rodné číslo, IČO, dates
regex = "1"

# Text decoding for Czech legacy encodings (windows-1250, UTF-16 BOM)
encoding_rs = "0.8"
once_cell = "1"

# NFC normalisation: macOS stores accented file names decomposed (NFD)
unicode-normalization = "0.1"

# String similarity (fuzzy customer name matching)
strsim = "0.11"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
tauri-plugin-log = "2.0"

# SHA256 for dedup detection
sha2 = "0.10"
hex = "0.4"

# UUID for session/manifest IDs
uuid = { version = "1", features = ["v4"] }

# Error handling
anyhow = "1"
thiserror = "1"

# HTTP client for CM version check and contribution upload
# rustls-tls avoids OpenSSL dependency on Windows MSVC
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Windows registry access — used for OneDrive path detection
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
