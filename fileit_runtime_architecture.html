<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileIT — Runtime Architecture</title>
<style>
body{margin:0;padding:24px;background:#FAF7F2;font-family:system-ui,sans-serif}
svg{width:100%;height:auto;display:block}
.t{font-family:system-ui,sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:system-ui,sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:system-ui,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.node{cursor:pointer}
.node:hover{opacity:0.85}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.box{fill:#F1EFE8;stroke:#888780;stroke-width:0.5}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:4 3;fill:none}

.c-teal rect,.c-teal circle,.c-teal ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.c-teal .t,.c-teal .th{fill:#085041}
.c-teal .ts{fill:#0F6E56}

.c-purple rect,.c-purple circle,.c-purple ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.c-purple .t,.c-purple .th{fill:#3C3489}
.c-purple .ts{fill:#534AB7}

.c-amber rect,.c-amber circle,.c-amber ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}
.c-amber .t,.c-amber .th{fill:#633806}
.c-amber .ts{fill:#854F0B}

.c-gray rect,.c-gray circle,.c-gray ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.c-gray .t,.c-gray .th{fill:#444441}
.c-gray .ts{fill:#5F5E5A}

@media(prefers-color-scheme:dark){
  body{background:#1a1917}
  .t,.th{fill:#E8E6E0}
  .ts{fill:#9C9A92}
  .arr{stroke:#888780}
  .leader{stroke:#5F5E5A}

  .c-teal rect,.c-teal circle,.c-teal ellipse{fill:#085041;stroke:#5DCAA5}
  .c-teal .t,.c-teal .th{fill:#9FE1CB}
  .c-teal .ts{fill:#5DCAA5}

  .c-purple rect,.c-purple circle,.c-purple ellipse{fill:#3C3489;stroke:#AFA9EC}
  .c-purple .t,.c-purple .th{fill:#CECBF6}
  .c-purple .ts{fill:#AFA9EC}

  .c-amber rect,.c-amber circle,.c-amber ellipse{fill:#633806;stroke:#EF9F27}
  .c-amber .t,.c-amber .th{fill:#FAC775}
  .c-amber .ts{fill:#EF9F27}

  .c-gray rect,.c-gray circle,.c-gray ellipse{fill:#444441;stroke:#B4B2A9}
  .c-gray .t,.c-gray .th{fill:#D3D1C7}
  .c-gray .ts{fill:#B4B2A9}
}
</style>
</head>
<body>
<svg viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
<title>FileIT runtime architecture — Tauri on Windows</title>
<desc>Three-layer structural diagram: React/TypeScript UI on top, Tauri IPC bridge in the middle, Rust core at the bottom, with Windows APIs on the right side.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g class="c-teal">
  <rect x="40" y="30" width="460" height="110" rx="16" stroke-width="0.5"/>
  <text class="th" x="60" y="56" dominant-baseline="central">UI layer — React + TypeScript</text>
  <text class="ts" x="60" y="74" dominant-baseline="central">Runs in WebView2 (Edge, already on Windows 10/11)</text>
</g>
<g class="c-teal">
  <rect x="60" y="88" width="130" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="125" y="106" text-anchor="middle" dominant-baseline="central">Screens / routing</text>
</g>
<g class="c-teal">
  <rect x="204" y="88" width="130" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="269" y="106" text-anchor="middle" dominant-baseline="central">Charts + visualizations</text>
</g>
<g class="c-teal">
  <rect x="348" y="88" width="130" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="413" y="106" text-anchor="middle" dominant-baseline="central">State (Zustand / signals)</text>
</g>

<line x1="270" y1="140" x2="270" y2="180" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="270" y1="200" x2="270" y2="240" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="163" dominant-baseline="central">invoke()</text>
<text class="ts" x="290" y="223" dominant-baseline="central">emit events</text>

<g class="c-gray">
  <rect x="40" y="180" width="460" height="56" rx="12" stroke-width="0.5"/>
  <text class="th" x="270" y="204" text-anchor="middle" dominant-baseline="central">Tauri IPC bridge</text>
  <text class="ts" x="270" y="222" text-anchor="middle" dominant-baseline="central">Type-safe commands · no raw FS access from UI</text>
</g>

<g class="c-purple">
  <rect x="40" y="256" width="460" height="230" rx="16" stroke-width="0.5"/>
  <text class="th" x="60" y="282" dominant-baseline="central">Rust core — Tauri backend</text>
  <text class="ts" x="60" y="300" dominant-baseline="central">All PII operations happen here, never in UI layer</text>
</g>
<g class="c-purple">
  <rect x="60" y="314" width="130" height="48" rx="6" stroke-width="0.5"/>
  <text class="th" x="125" y="334" text-anchor="middle" dominant-baseline="central">Scanner</text>
  <text class="ts" x="125" y="352" text-anchor="middle" dominant-baseline="central">walkdir, ignore</text>
</g>
<g class="c-purple">
  <rect x="204" y="314" width="130" height="48" rx="6" stroke-width="0.5"/>
  <text class="th" x="269" y="334" text-anchor="middle" dominant-baseline="central">Extractor</text>
  <text class="ts" x="269" y="352" text-anchor="middle" dominant-baseline="central">pdf-extract, docx-rs</text>
</g>
<g class="c-purple">
  <rect x="348" y="314" width="130" height="48" rx="6" stroke-width="0.5"/>
  <text class="th" x="413" y="334" text-anchor="middle" dominant-baseline="central">Classifier</text>
  <text class="ts" x="413" y="352" text-anchor="middle" dominant-baseline="central">regex + ML heuristics</text>
</g>
<g class="c-purple">
  <rect x="60" y="378" width="130" height="48" rx="6" stroke-width="0.5"/>
  <text class="th" x="125" y="398" text-anchor="middle" dominant-baseline="central">Cloud probe</text>
  <text class="ts" x="125" y="416" text-anchor="middle" dominant-baseline="central">Registry + process list</text>
</g>
<g class="c-purple">
  <rect x="204" y="378" width="130" height="48" rx="6" stroke-width="0.5"/>
  <text class="th" x="269" y="398" text-anchor="middle" dominant-baseline="central">Session store</text>
  <text class="ts" x="269" y="416" text-anchor="middle" dominant-baseline="central">In-memory, no disk write</text>
</g>
<g class="c-purple">
  <rect x="348" y="378" width="130" height="48" rx="6" stroke-width="0.5"/>
  <text class="th" x="413" y="398" text-anchor="middle" dominant-baseline="central">Mover</text>
  <text class="ts" x="413" y="416" text-anchor="middle" dominant-baseline="central">fs::rename, dry-run first</text>
</g>

<g class="c-amber">
  <rect x="520" y="256" width="140" height="230" rx="12" stroke-width="0.5"/>
  <text class="th" x="590" y="280" text-anchor="middle" dominant-baseline="central">Windows APIs</text>
</g>
<g class="c-amber">
  <rect x="534" y="294" width="112" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="590" y="312" text-anchor="middle" dominant-baseline="central">HKCU Registry</text>
</g>
<g class="c-amber">
  <rect x="534" y="340" width="112" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="590" y="358" text-anchor="middle" dominant-baseline="central">WMI process list</text>
</g>
<g class="c-amber">
  <rect x="534" y="386" width="112" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="590" y="404" text-anchor="middle" dominant-baseline="central">Shell file ops</text>
</g>
<g class="c-amber">
  <rect x="534" y="432" width="112" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="590" y="450" text-anchor="middle" dominant-baseline="central">WebView2 runtime</text>
</g>

<path d="M500 338 L520 338" fill="none" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M500 400 L520 400" fill="none" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
</body>
</html>
